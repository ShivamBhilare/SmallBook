{% extends "base.html" %}

{% block title %}Update Password - SmallBook{% endblock %}

{% block navbar %}
<nav class="w-full px-4 lg:px-8 py-4 flex justify-between items-center z-50">
    <a href="/" class="flex items-center gap-sm cursor-pointer">
        <img alt="SmallBook Logo" class="h-8 w-8 object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuClev6H_G8bgxiebPRYEsGg5DJQbeRbRX1bIbaGmZ7bw9bDu5oqjKqVzDyUnSE8M_e1hNmNtlHNtX8FW44z0Ri3qO-9nf0l1S4ztQNmPXQbIr7pJJocaG0lwVpX4TtEFBgGTOBbo6EDEx4QuGOQPzw0D05jnkECQQPyyvXkAO4ZTaNsUnjgxqO9qii1BPtKMkBKSt5A5HQLHqhJ1sJsZG5usQEtEZMXCbVP6vivy0VtikjnWP51f7lVlg">
        <span class="text-headline-md font-headline-md font-bold text-primary dark:text-dark-text tracking-tight">SmallBook</span>
    </a>
    <button onclick="toggleTheme()" class="h-9 w-9 flex items-center justify-center rounded-full text-on-surface-variant dark:text-dark-text-muted hover:text-secondary dark:hover:text-dark-accent hover:bg-surface-variant/80 dark:hover:bg-dark-panel-hover transition-colors">
        <span class="material-symbols-outlined text-[20px] theme-icon">dark_mode</span>
    </button>
</nav>
{% endblock %}

{% block content %}
<main class="flex-1 flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-surface-container-lowest dark:bg-dark-panel border border-paper dark:border-dark-border rounded-2xl custom-shadow p-6 sm:p-8 relative">
        
        <div class="text-center mb-8">
            <h1 class="text-headline-lg font-bold text-on-surface dark:text-dark-text tracking-tight mb-2">Set new password</h1>
            <p class="text-body-md text-on-surface-variant dark:text-dark-text-muted">Please enter your new password below.</p>
        </div>

        <form action="#" method="POST" class="space-y-4">
            <div>
                <label for="password" class="block text-label-sm font-medium text-on-surface dark:text-dark-text mb-1.5 ml-1">New Password</label>
                <div class="relative bg-surface-bright dark:bg-dark-bg border border-paper dark:border-dark-border rounded-xl focus-within:border-secondary dark:focus-within:border-dark-accent transition-colors flex items-center">
                    <input type="password" id="password" name="password" required class="w-full bg-transparent border-none focus:ring-0 text-body-md text-on-surface dark:text-dark-text placeholder:text-on-surface-variant/50 dark:placeholder:text-dark-text-muted pl-4 pr-10 py-3 outline-none rounded-xl" placeholder="••••••••">
                    <button type="button" onclick="togglePassword('password', 'eye-icon-update1')" class="absolute right-3 h-8 w-8 flex items-center justify-center text-on-surface-variant dark:text-dark-text-muted hover:text-primary dark:hover:text-dark-text transition-colors">
                        <span id="eye-icon-update1" class="material-symbols-outlined text-[20px]">visibility</span>
                    </button>
                </div>
            </div>
            
            <div>
                <label for="confirm_password" class="block text-label-sm font-medium text-on-surface dark:text-dark-text mb-1.5 ml-1">Confirm New Password</label>
                <div class="relative bg-surface-bright dark:bg-dark-bg border border-paper dark:border-dark-border rounded-xl focus-within:border-secondary dark:focus-within:border-dark-accent transition-colors flex items-center">
                    <input type="password" id="confirm_password" name="confirm_password" required class="w-full bg-transparent border-none focus:ring-0 text-body-md text-on-surface dark:text-dark-text placeholder:text-on-surface-variant/50 dark:placeholder:text-dark-text-muted pl-4 pr-10 py-3 outline-none rounded-xl" placeholder="••••••••">
                    <button type="button" onclick="togglePassword('confirm_password', 'eye-icon-update2')" class="absolute right-3 h-8 w-8 flex items-center justify-center text-on-surface-variant dark:text-dark-text-muted hover:text-primary dark:hover:text-dark-text transition-colors">
                        <span id="eye-icon-update2" class="material-symbols-outlined text-[20px]">visibility</span>
                    </button>
                </div>
            </div>

            <button type="submit" class="w-full bg-[#141413] dark:bg-dark-text text-white dark:text-dark-bg rounded-full py-3 mt-4 font-label-md hover:opacity-80 transition-opacity">
                Update Password
            </button>
        </form>
    </div>
</main>
{% endblock %}

{% block extra_scripts %}
<script>
    function togglePassword(inputId, iconId) {
        const input = document.getElementById(inputId);
        const icon = document.getElementById(iconId);
        if (input.type === "password") {
            input.type = "text";
            icon.innerText = "visibility_off";
        } else {
            input.type = "password";
            icon.innerText = "visibility";
        }
    }
</script>
{% endblock %}
