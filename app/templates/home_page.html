{% extends "base.html" %}

{% block title %}SmallBook - Home{% endblock %}

{% block content %}
<div x-data="notebookDashboard()" class="flex flex-col min-h-screen">
    
    <div class="bg-surface-container-low dark:bg-dark-panel w-full border-b border-paper dark:border-dark-border py-3 px-4 lg:px-margin z-40">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            
            <!-- Search Bar -->
            <div class="w-full md:max-w-md flex items-center bg-surface-container-lowest dark:bg-dark-bg border border-paper dark:border-dark-border rounded-full px-4 py-1.5 focus-within:border-secondary dark:focus-within:border-dark-accent transition-colors group">
                <span class="material-symbols-outlined text-on-surface-variant dark:text-dark-text-muted text-[20px] mr-2">search</span>
                <input type="text" x-model="searchQuery" class="w-full bg-transparent border-none focus:ring-0 text-[14px] text-on-surface dark:text-dark-text placeholder:text-on-surface-variant/60 dark:placeholder:text-dark-text-muted outline-none" placeholder="Search notebooks...">
            </div>
            
            <!-- Filters & Views -->
            <div class="flex items-center gap-3 w-full md:w-auto justify-between md:justify-end">
                <!-- Grid/List View Toggles -->
                <div class="flex items-center gap-1 bg-surface-container-lowest dark:bg-dark-bg border border-paper dark:border-dark-border rounded-full p-1">
                    <button @click="viewMode = 'grid'" :class="viewMode === 'grid' ? 'bg-surface-variant/80 dark:bg-dark-panel-hover text-primary dark:text-dark-text custom-shadow' : 'text-on-surface-variant dark:text-dark-text-muted hover:bg-surface-variant/50 dark:hover:bg-dark-panel-hover/50'" class="h-7 w-7 flex items-center justify-center rounded-full transition-all">
                        <span class="material-symbols-outlined text-[18px]">grid_view</span>
                    </button>
                    <button @click="viewMode = 'list'" :class="viewMode === 'list' ? 'bg-surface-variant/80 dark:bg-dark-panel-hover text-primary dark:text-dark-text custom-shadow' : 'text-on-surface-variant dark:text-dark-text-muted hover:bg-surface-variant/50 dark:hover:bg-dark-panel-hover/50'" class="h-7 w-7 flex items-center justify-center rounded-full transition-all">
                        <span class="material-symbols-outlined text-[18px]">view_list</span>
                    </button>
                </div>
                
                <!-- Sort Dropdown -->
                <div class="relative" x-data="{ sortOpen: false }">
                    <button @click="sortOpen = !sortOpen" class="flex items-center gap-1.5 bg-surface-container-lowest dark:bg-dark-bg border border-paper dark:border-dark-border px-4 py-1.5 rounded-full text-[14px] font-medium text-on-surface dark:text-dark-text hover:border-secondary dark:hover:border-dark-accent transition-colors">
                        <span x-text="sortBy === 'recent' ? 'Most Recent' : (sortBy === 'oldest' ? 'Oldest' : 'Title A-Z')"></span>
                        <span class="material-symbols-outlined text-[18px]">expand_more</span>
                    </button>
                    <!-- Dropdown Menu -->
                    <div x-show="sortOpen" @click.outside="sortOpen = false" x-transition.opacity.duration.200ms x-cloak class="absolute right-0 top-full mt-2 w-40 bg-surface-container-lowest dark:bg-dark-panel border border-paper dark:border-dark-border rounded-xl shadow-lg z-50 overflow-hidden">
                        <button @click="sortBy = 'recent'; sortOpen = false" class="w-full text-left px-4 py-2.5 text-[14px] text-on-surface dark:text-dark-text hover:bg-surface-variant/50 dark:hover:bg-dark-panel-hover transition-colors">Most Recent</button>
                        <button @click="sortBy = 'oldest'; sortOpen = false" class="w-full text-left px-4 py-2.5 text-[14px] text-on-surface dark:text-dark-text hover:bg-surface-variant/50 dark:hover:bg-dark-panel-hover transition-colors">Oldest</button>
                        <button @click="sortBy = 'title'; sortOpen = false" class="w-full text-left px-4 py-2.5 text-[14px] text-on-surface dark:text-dark-text hover:bg-surface-variant/50 dark:hover:bg-dark-panel-hover transition-colors">Title A-Z</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <main class="flex-1 w-full max-w-7xl mx-auto px-4 lg:px-margin py-8 lg:py-12 relative">
        
        <!-- Error Banner -->
        <div x-show="errorMessage" x-cloak x-transition class="mb-6 p-4 rounded-xl bg-error/10 border border-error/20 text-error flex items-center gap-3">
            <span class="material-symbols-outlined">error</span>
            <p x-text="errorMessage" class="font-body-md"></p>
            <button @click="errorMessage = ''" class="ml-auto hover:bg-error/20 p-1 rounded-full transition-colors">
                <span class="material-symbols-outlined text-[20px]">close</span>
            </button>
        </div>

        <div class="flex items-center justify-between mb-8">
            <h1 class="font-semibold text-[24px] lg:text-[32px] tracking-tight text-on-surface dark:text-dark-text">Recent Notebooks</h1>
        </div>
        
        <div x-show="isLoading" x-cloak class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 animate-pulse">
            <template x-for="i in 4" :key="i">
                <div class="h-[220px] rounded-xl bg-surface-variant/30 dark:bg-dark-panel-hover/30 border border-paper dark:border-dark-border p-5"></div>
            </template>
        </div>
        
        <div x-show="!isLoading" x-cloak :class="viewMode === 'grid' ? 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6' : 'flex flex-col gap-4'">
            
            <!-- Create New Card -->
            <button @click="isCreateModalOpen = true" :class="viewMode === 'grid' ? 'h-[220px] flex-col justify-center items-center text-center' : 'h-24 flex-row items-center justify-start px-6'" class="group rounded-xl border-2 border-dashed border-outline-variant dark:border-dark-border hover:border-secondary dark:hover:border-dark-accent bg-surface-bright/50 dark:bg-dark-panel/50 flex gap-4 transition-colors">
                <div class="h-12 w-12 rounded-full bg-surface-variant dark:bg-dark-panel-hover group-hover:bg-secondary/10 dark:group-hover:bg-dark-accent/20 flex items-center justify-center transition-colors">
                    <span class="material-symbols-outlined text-on-surface-variant dark:text-dark-text-muted group-hover:text-secondary dark:group-hover:text-dark-accent text-[24px]">add</span>
                </div>
                <span class="font-label-md text-on-surface-variant dark:text-dark-text-muted group-hover:text-secondary dark:group-hover:text-dark-accent transition-colors">Create New Notebook</span>
            </button>
            
            <!-- Dynamic Notebook Cards (Matches Image Layout exactly) -->
            <template x-for="notebook in filteredNotebooks" :key="notebook.id">
                <div @click="window.location.href = `/notebooks/workspace/${notebook.id}`" 
                     :class="viewMode === 'grid' ? 'h-[220px] flex-col' : 'h-24 flex-row items-center'" 
                     class="group relative rounded-xl bg-surface-container-lowest dark:bg-dark-panel border border-paper dark:border-dark-border p-5 flex justify-between hover-custom-shadow hover:border-secondary dark:hover:border-dark-accent transition-all cursor-pointer">
                    
                    <!-- Grid Layout Inner Content -->
                    <div x-show="viewMode === 'grid'" class="flex flex-col h-full w-full">
                        <!-- Top: Icon and Menu -->
                        <div class="flex justify-between items-start mb-3">
                            <div class="h-10 w-10 rounded-lg bg-surface-bright dark:bg-dark-bg border border-paper dark:border-dark-border flex items-center justify-center shrink-0">
                                <span class="material-symbols-outlined text-secondary dark:text-dark-accent text-[20px]">menu_book</span>
                            </div>
                            
                            <!-- 3-Dots Menu -->
                            <div class="relative shrink-0">
                                <button @click.stop.prevent="activeMenu = activeMenu === notebook.id ? null : notebook.id" class="h-8 w-8 flex items-center justify-center rounded-full text-on-surface-variant dark:text-dark-text-muted opacity-0 group-hover:opacity-100 hover:bg-surface-variant/80 dark:hover:bg-dark-panel-hover hover:text-primary dark:hover:text-dark-text transition-all">
                                    <span class="material-symbols-outlined text-[20px]">more_vert</span>
                                </button>
                                <div x-show="activeMenu === notebook.id" @click.outside="if(activeMenu === notebook.id) activeMenu = null" x-transition.opacity.duration.200ms x-cloak class="absolute right-0 top-8 w-36 bg-surface-container-lowest dark:bg-dark-panel border border-paper dark:border-dark-border rounded-xl shadow-lg z-[100] overflow-hidden">
                                    <button @click.stop.prevent="confirmDelete(notebook.id)" class="w-full text-left px-4 py-2.5 text-[14px] text-error hover:bg-error/10 transition-colors flex items-center gap-2">
                                        <span class="material-symbols-outlined text-[18px]">delete</span> Delete
                                    </button>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Middle: Title Only -->
                        <h3 class="font-semibold text-[16px] leading-snug text-on-surface dark:text-dark-text mb-1 line-clamp-2" x-text="notebook.title"></h3>
                        <!-- Spacer to push footer down -->
                        <div class="flex-1"></div>
                        
                        <!-- Bottom: Date/Sources -->
                        <div class="pt-3 border-t border-paper dark:border-dark-border flex items-center justify-between mt-auto">
                            <span class="text-[12px] font-semibold uppercase tracking-wider text-on-surface-variant dark:text-dark-text-muted">
                                <span x-text="formatDateUpper(notebook.created_at)"></span> &bull; 0 SOURCES
                            </span>
                        </div>
                    </div>

                    <!-- List Layout Inner Content -->
                    <div x-show="viewMode === 'list'" class="flex items-center w-full gap-5">
                        <div class="h-10 w-10 rounded-lg bg-surface-bright dark:bg-dark-bg border border-paper dark:border-dark-border flex items-center justify-center shrink-0">
                            <span class="material-symbols-outlined text-secondary dark:text-dark-accent text-[20px]">menu_book</span>
                        </div>
                        <div class="flex-1 min-w-0">
                            <h3 class="font-semibold text-[16px] text-on-surface dark:text-dark-text line-clamp-1" x-text="notebook.title"></h3>
                            <p class="text-[12px] font-semibold uppercase tracking-wider text-on-surface-variant dark:text-dark-text-muted mt-1">
                                <span x-text="formatDateUpper(notebook.created_at)"></span> &bull; 0 SOURCES
                            </p>
                        </div>
                        
                        <!-- 3-Dots Menu -->
                        <div class="relative shrink-0">
                            <button @click.stop.prevent="activeMenu = activeMenu === notebook.id ? null : notebook.id" class="h-8 w-8 flex items-center justify-center rounded-full text-on-surface-variant dark:text-dark-text-muted opacity-0 group-hover:opacity-100 hover:bg-surface-variant/80 dark:hover:bg-dark-panel-hover hover:text-primary dark:hover:text-dark-text transition-all">
                                <span class="material-symbols-outlined text-[20px]">more_vert</span>
                            </button>
                            <div x-show="activeMenu === notebook.id" @click.outside="if(activeMenu === notebook.id) activeMenu = null" x-transition.opacity.duration.200ms x-cloak class="absolute right-0 top-8 w-36 bg-surface-container-lowest dark:bg-dark-panel border border-paper dark:border-dark-border rounded-xl shadow-lg z-[100] overflow-hidden">
                                <button @click.stop.prevent="confirmDelete(notebook.id)" class="w-full text-left px-4 py-2.5 text-[14px] text-error hover:bg-error/10 transition-colors flex items-center gap-2">
                                    <span class="material-symbols-outlined text-[18px]">delete</span> Delete
                                </button>
                            </div>
                        </div>
                    </div>
                    
                </div>
            </template>
            
        </div>
    </main>

    <template x-teleport="body">
        <div x-show="isDeleteModalOpen" x-cloak class="fixed inset-0 z-[100] flex items-center justify-center" aria-labelledby="delete-modal-title" role="dialog" aria-modal="true">
            <!-- Backdrop -->
            <div x-show="isDeleteModalOpen" x-transition.opacity class="fixed inset-0 bg-surface/80 dark:bg-dark-bg/80 backdrop-blur-sm" @click="cancelDelete"></div>
            
            <!-- Modal Panel -->
            <div x-show="isDeleteModalOpen" 
                 x-transition:enter="ease-out duration-300" 
                 x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95" 
                 x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100" 
                 x-transition:leave="ease-in duration-200" 
                 x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100" 
                 x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95" 
                 class="relative w-full max-w-sm transform overflow-hidden rounded-2xl bg-surface-container-lowest dark:bg-dark-panel p-6 text-left shadow-xl transition-all border border-paper dark:border-dark-border m-4">
                
                <div class="flex items-center gap-4 mb-4">
                    <div class="h-10 w-10 rounded-full bg-error/10 flex items-center justify-center shrink-0">
                        <span class="material-symbols-outlined text-error text-[24px]">warning</span>
                    </div>
                    <h3 class="text-lg font-semibold text-on-surface dark:text-dark-text" id="delete-modal-title">Delete Notebook</h3>
                </div>
                
                <p class="text-body-md text-on-surface-variant dark:text-dark-text-muted mb-6">
                    Are you sure you want to delete this notebook? All notes, sources, and configurations will be permanently removed. <span class="font-semibold text-on-surface dark:text-dark-text">This action cannot be undone.</span>
                </p>
                
                <div class="flex justify-end gap-3">
                    <button type="button" @click="cancelDelete" class="px-5 py-2.5 rounded-full font-label-lg font-medium text-on-surface-variant dark:text-dark-text-muted hover:bg-surface-variant dark:hover:bg-dark-panel-hover transition-colors">
                        Cancel
                    </button>
                    <button type="button" @click="executeDelete" :disabled="isDeleting" class="px-5 py-2.5 rounded-full font-label-lg font-medium bg-error text-on-error hover:bg-error/90 transition-colors shadow-sm disabled:opacity-70 disabled:cursor-not-allowed flex items-center gap-2">
                        <span x-show="!isDeleting">Permanently Delete</span>
                        <span x-show="isDeleting" x-cloak class="material-symbols-outlined animate-spin text-[18px]">progress_activity</span>
                    </button>
                </div>
            </div>
        </div>
    </template>

    <!-- Create Notebook Modal (Teleported to body) -->
    <template x-teleport="body">
        <div x-show="isCreateModalOpen" x-cloak class="fixed inset-0 z-[100] flex items-center justify-center" aria-labelledby="modal-title" role="dialog" aria-modal="true">
            <!-- Backdrop -->
            <div x-show="isCreateModalOpen" x-transition.opacity class="fixed inset-0 bg-surface/80 dark:bg-dark-bg/80 backdrop-blur-sm" @click="closeModal"></div>
            
            <!-- Modal Panel -->
            <div x-show="isCreateModalOpen" 
                 x-transition:enter="ease-out duration-300" 
                 x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95" 
                 x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100" 
                 x-transition:leave="ease-in duration-200" 
                 x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100" 
                 x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95" 
                 class="relative w-full max-w-md transform overflow-hidden rounded-2xl bg-surface-container-lowest dark:bg-dark-panel p-6 text-left shadow-xl transition-all border border-paper dark:border-dark-border m-4">
                
                <div class="flex items-center justify-between mb-5">
                    <h3 class="text-lg font-semibold text-on-surface dark:text-dark-text" id="modal-title">Create Notebook</h3>
                    <button @click="closeModal" class="text-on-surface-variant dark:text-dark-text-muted hover:text-on-surface dark:hover:text-dark-text rounded-full h-8 w-8 flex items-center justify-center hover:bg-surface-variant dark:hover:bg-dark-panel-hover transition-colors">
                        <span class="material-symbols-outlined text-[20px]">close</span>
                    </button>
                </div>
                
                <form @submit.prevent="submitCreateNotebook">
                    <!-- Title -->
                    <div class="mb-6">
                        <label for="notebook-title" class="block font-label-md text-on-surface dark:text-dark-text mb-2">Notebook Title</label>
                        <input type="text" id="notebook-title" x-model="newNotebookTitle" required placeholder="e.g., Biology 101, Fall Quarter" class="w-full bg-surface-bright dark:bg-dark-bg border border-outline-variant dark:border-dark-border rounded-lg px-4 py-2.5 text-on-surface dark:text-dark-text focus:outline-none focus:border-secondary dark:focus:border-dark-accent focus:ring-1 focus:ring-secondary dark:focus:ring-dark-accent transition-all">
                    </div>
                    
                    <!-- Provider Selection -->
                    <div class="mb-6">
                        <label for="provider-select" class="block font-label-md text-on-surface dark:text-dark-text mb-2">Default LLM Provider (Optional)</label>
                        <select id="provider-select" x-model="newNotebookProvider" class="w-full bg-surface-bright dark:bg-dark-bg border border-outline-variant dark:border-dark-border rounded-lg px-4 py-2.5 text-on-surface dark:text-dark-text focus:outline-none focus:border-secondary dark:focus:border-dark-accent focus:ring-1 focus:ring-secondary dark:focus:ring-dark-accent transition-all appearance-none cursor-pointer">
                            <option value="">System Default</option>
                            <option value="openai">OpenAI</option>
                            <option value="anthropic">Anthropic (Claude)</option>
                            <option value="gemini">Google Gemini</option>
                            <option value="groq">Groq</option>
                        </select>
                    </div>
                    
                    <!-- Modal Error -->
                    <div x-show="modalError" x-cloak class="mb-4 text-sm text-error" x-text="modalError"></div>

                    <div class="flex justify-end gap-3 mt-6">
                        <button type="button" @click="closeModal" class="px-5 py-2.5 rounded-full font-label-lg font-medium text-on-surface-variant dark:text-dark-text-muted hover:bg-surface-variant dark:hover:bg-dark-panel-hover transition-colors">
                            Cancel
                        </button>
                        <button type="submit" :disabled="isCreating" class="px-5 py-2.5 rounded-full font-label-lg font-medium bg-primary text-on-primary hover:bg-primary/90 dark:bg-dark-accent dark:text-dark-bg dark:hover:bg-dark-accent/90 transition-colors shadow-sm disabled:opacity-70 disabled:cursor-not-allowed flex items-center gap-2">
                            <span x-show="!isCreating">Create</span>
                            <span x-show="isCreating" x-cloak class="material-symbols-outlined animate-spin text-[18px]">progress_activity</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </template>
</div>

<script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('notebookDashboard', () => ({
            // State
            notebooks: [],
            isLoading: true,
            searchQuery: '',
            viewMode: localStorage.getItem('viewMode') || 'grid', // 'grid' or 'list' loaded from storage
            sortBy: 'recent', // 'recent', 'oldest', 'title'
            activeMenu: null, // Tracks currently open dropdown menu
            
            // Modal Form State
            isCreateModalOpen: false,
            newNotebookTitle: '',
            newNotebookProvider: '',
            isCreating: false,
            
            isDeleteModalOpen: false,
            notebookToDelete: null,
            isDeleting: false,

            // Error States
            errorMessage: '',
            modalError: '',

            // Initialize Component
            init() {
                this.fetchNotebooks();
                // Persist layout view selection when it changes
                this.$watch('viewMode', value => localStorage.setItem('viewMode', value));
            },

            // Fetch Notebooks on load
            async fetchNotebooks() {
                this.isLoading = true;
                this.errorMessage = '';
                try {
                    const response = await fetch('/notebooks/api/list');
                    if (!response.ok) throw new Error('Failed to fetch notebooks');
                    const data = await response.json();
                    this.notebooks = data.notebooks || [];
                } catch (error) {
                    this.errorMessage = error.message || 'An error occurred while loading notebooks.';
                } finally {
                    this.isLoading = false;
                }
            },

            // Computed property for sorting and searching
            get filteredNotebooks() {
                let filtered = this.notebooks.filter(nb => 
                    nb.title.toLowerCase().includes(this.searchQuery.toLowerCase())
                );
                
                return filtered.sort((a, b) => {
                    if (this.sortBy === 'recent') {
                        return new Date(b.created_at) - new Date(a.created_at);
                    } else if (this.sortBy === 'oldest') {
                        return new Date(a.created_at) - new Date(b.created_at);
                    } else if (this.sortBy === 'title') {
                        return a.title.localeCompare(b.title);
                    }
                });
            },

            // Format date to string like "JUL 3, 2026"
            formatDateUpper(dateString) {
                if (!dateString) return '';
                const date = new Date(dateString);
                return date.toLocaleDateString('en-US', { 
                    month: 'short', 
                    day: 'numeric', 
                    year: 'numeric' 
                }).toUpperCase();
            },

            // Close Modal & Reset Form
            closeModal() {
                this.isCreateModalOpen = false;
                this.newNotebookTitle = '';
                this.newNotebookProvider = '';
                this.modalError = '';
            },

            // Submit New Notebook and Redirect
            async submitCreateNotebook() {
                this.isCreating = true;
                this.modalError = '';
                try {
                    const response = await fetch('/notebooks/api/create', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            title: this.newNotebookTitle || "Untitled SmallBook",
                            preferred_llm_provider: this.newNotebookProvider || null
                        })
                    });
                    
                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.detail || 'Failed to create notebook');
                    }
                    
                    const data = await response.json();
                    
                    // REDIRECT TO WORKSPACE ON SUCCESS
                    window.location.href = `/notebooks/workspace/${data.notebook.id}`;
                    
                } catch (error) {
                    this.modalError = error.message;
                    this.isCreating = false;
                }
            },

            // Open Delete Modal
            confirmDelete(id) {
                this.notebookToDelete = id;
                this.activeMenu = null;
                this.isDeleteModalOpen = true;
            },

            // Close Delete Modal
            cancelDelete() {
                this.isDeleteModalOpen = false;
                this.notebookToDelete = null;
                this.isDeleting = false;
            },

            // Execute Delete Request
            async executeDelete() {
                if (!this.notebookToDelete) return;
                
                this.isDeleting = true;
                try {
                    const response = await fetch(`/notebooks/api/${this.notebookToDelete}`, {
                        method: 'DELETE'
                    });
                    
                    if (!response.ok) throw new Error('Failed to delete notebook');
                    
                    // Remove from local state to update UI immediately
                    this.notebooks = this.notebooks.filter(nb => nb.id !== this.notebookToDelete);
                    this.cancelDelete();
                } catch (error) {
                    this.errorMessage = error.message;
                    this.cancelDelete();
                }
            }
        }));
    });
</script>
{% endblock %}
